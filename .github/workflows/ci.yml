name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CPU-only torch: the default wheel pulls CUDA libraries and fills the runner's disk.
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: pip install --no-deps -r requirements-extra.txt
      - run: python -m pytest -q tests
      # Regenerate every table and number from the committed per-query results and fail on any difference.
      - run: python -m signstudy.report
      - run: git diff --exit-code -- results/tables paper/numbers.tex CLAIMS.md
